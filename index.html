<!DOCTYPE html>
<html>
<head>
    <title>title daw dito</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background-color: #3B4049;
        }

        .wrapper {
            height: 200px;
            width: 300px;
            background-color: #3760C9;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 0;
            perspective: 1000px;
        }

        .lid {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            left: 0;
            border-right: 150px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 150px solid transparent;
            transform-origin: top;
            transition: transform 0.25s linear;
            pointer-events: none;
        }

        .lid.one {
            border-top: 100px solid #658ced;
            transform: rotateX(0deg);
            z-index: 4;
            transition-delay: 0.75s;
        }

        .lid.two {
            border-top: 100px solid #3760C9;
            transform: rotateX(90deg);
            z-index: 1;
            transition-delay: 0.5s;
        }

        .envelope {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            left: 0;
            border-top: 100px solid transparent;
            border-right: 150px solid #c4e3f7;
            border-bottom: 100px solid #C4DFF0;
            border-left: 150px solid #a4d4f2;
            pointer-events: none;
            z-index: 2;
        }

    .letter {
            font-family: 'Comic Relief', sans-serif;
            position: absolute;
            top: 0;
            width: 80%;
            height: 80%;
            background-color: white;
            border: none;
            border-radius: 15px;
            z-index: 1;
            transition: 0.5s;
            cursor: pointer;
}

        .letter p {
            text-align: center;
            font-size: 30px;
            margin-top: 30px;
            color: #3B4049;
        }

        .wrapper:hover .lid.one {
            transform: rotateX(90deg);
            transition-delay: 0s;
        }

        .wrapper:hover .lid.two {
            transform: rotateX(180deg);
            transition-delay: 0.25s;
        }

        .wrapper:hover .letter {
            transform: translateY(-50px);
            transition-delay: 0.5s;
        }

        .letter:hover {
            background-color: #fff5fa;
        }
    </style>
</head>

<body>

        <div class="wrapper">

            <div class="lid one"></div>
            <div class="lid two"></div>
            <div class="envelope"></div>

        <button class="letter" onclick="openLetter()">
            <p>Hiii, Zaisyy!</p>
        </button>

</div>

    <script>
        function openLetter() {
            window.location.href = "message.html";
        }
</script>
</body>
</html>
